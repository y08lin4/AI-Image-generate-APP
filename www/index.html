<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LyAI生图工作台</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, #e0ebff 0, transparent 28rem), #f6f7fb; color: #0f172a; }
      main { width: min(88vw, 420px); padding: 28px; border: 1px solid #e2e8f0; border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: 0 16px 40px rgba(15,23,42,.08); text-align: center; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      a { display: inline-flex; margin-top: 18px; color: #2563eb; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: radial-gradient(circle at top left, #111c31 0, #080d18 44%, #060913 100%); color: #e5edf8; }
        main { background: rgba(16,24,39,.94); border-color: #243247; box-shadow: none; }
        p { color: #aebdd2; }
        a { color: #93c5fd; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LyAI生图工作台</h1>
      <p>Opening LyAI image workbench...</p>
      <a href="https://ai-image.ailinyu.de/">Open manually</a>
    </main>
  </body>
</html>
